upstream backend_servers {
    least_conn;
    server 172.20.0.2:8080;
    server 172.20.0.3:8080;
}
server {
    listen 80;
    keepalive_timeout 0;
    location / {
        proxy_pass http://backend_servers;
        proxy_http_version 1.0;
        proxy_set_header Connection "close";
        add_header Connection "close";
    }
}
